<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FableLogs analysis tests</title>
  <style>body { font: 14px monospace; background: #111; color: #ddd; } .pass { color: #6c6; } .fail { color: #e66; }</style>
</head>
<body>
<pre id="out"></pre>
<script type="module">
import { buildLookups, analyzeDeath, analyzeFight, summarizeReport, consumables, utility, throughput } from '../js/analysis.js';
import { parseReportLink } from '../js/api.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
function check(name, cond, detail = '') {
  if (cond) pass++; else fail++;
  out.innerHTML += `<span class="${cond ? 'pass' : 'fail'}">${cond ? 'PASS' : 'FAIL'}</span> ${name}${cond ? '' : ` — ${detail}`}\n`;
}

const report = {
  title: 'Test', startTime: 0,
  fights: [
    { id: 1, encounterID: 100, name: 'Stone Guard', kill: false, startTime: 0, endTime: 120000, bossPercentage: 34.5, size: 10, friendlyPlayers: [1, 2, 3, 4] },
    { id: 2, encounterID: 100, name: 'Stone Guard', kill: true, startTime: 200000, endTime: 400000, bossPercentage: 0, size: 10, friendlyPlayers: [1, 2, 3, 4] },
  ],
  masterData: {
    actors: [
      { id: 1, name: 'Tanky', type: 'Player', subType: 'Warrior' },
      { id: 2, name: 'Healz', type: 'Player', subType: 'Priest' },
      { id: 3, name: 'Pewpew', type: 'Player', subType: 'Mage' },
      { id: 4, name: 'Stabby', type: 'Player', subType: 'Rogue' },
      { id: 50, name: 'Jasper Guardian', type: 'NPC', subType: 'Boss' },
    ],
    abilities: [
      { gameID: 1, name: 'Melee' },
      { gameID: 1001, name: 'Jasper Chains' },
      { gameID: 1002, name: 'Overload' },
      { gameID: 3, name: 'Falling' },
      { gameID: 2001, name: 'Flash Heal' },
      { gameID: 105691, name: 'Flask of the Warm Sun', icon: 'trade_alchemy_potione6.jpg' },
      { gameID: 104277, name: 'Well Fed', icon: 'spell_misc_food.jpg' },
      { gameID: 105702, name: 'Potion of the Jade Serpent' },
      { gameID: 3000, name: 'Kick' },
      { gameID: 3001, name: 'Cobalt Mine' },
    ],
  },
};
const lk = buildLookups(report);

// Mage one-shot by Overload at 60s.
const ev = [
  { timestamp: 59000, type: 'heal', sourceID: 2, targetID: 3, abilityGameID: 2001, amount: 5000 },
  { timestamp: 60000, type: 'damage', sourceID: 50, targetID: 3, abilityGameID: 1002, amount: 450000, overkill: 50000, hitPoints: 0, maxHitPoints: 400000, resourceActor: 2 },
];
const oneShot = analyzeDeath({ type: 'death', timestamp: 60000, targetID: 3, fight: 1 }, ev, lk);
check('one-shot detected', oneShot.kind === 'oneshot', oneShot.kind + ': ' + oneShot.headline);
check('one-shot names ability', oneShot.headline.includes('Overload'), oneShot.headline);

// Rogue: three Jasper Chains ticks then dies, no heals.
const ev2 = [2000, 5000, 8000, 9500].map((dt, i) => ({ timestamp: 50000 + dt, type: 'damage', sourceID: 50, targetID: 4, abilityGameID: 1001, amount: 30000, overkill: i === 3 ? 1000 : 0 }));
const worn = analyzeDeath({ type: 'death', timestamp: 59500, targetID: 4, fight: 1 }, ev2, lk);
check('attrition detected', worn.kind === 'attrition', worn.kind + ': ' + worn.headline);
check('no-heal note', worn.notes.some((n) => n.startsWith('No healing or shields')), worn.notes.join(' | '));
check('repeated ability note', worn.notes.some((n) => n.includes('Hit 4 times by Jasper Chains')), worn.notes.join(' | '));

// Burst: lots of damage in final 2s.
const ev3 = [
  { timestamp: 51000, type: 'damage', sourceID: 50, targetID: 2, abilityGameID: 1001, amount: 5000 },
  { timestamp: 58000, type: 'damage', sourceID: 50, targetID: 2, abilityGameID: 1002, amount: 60000 },
  { timestamp: 59000, type: 'damage', sourceID: 50, targetID: 2, abilityGameID: 1001, amount: 60000 },
  { timestamp: 59900, type: 'damage', sourceID: 50, targetID: 2, abilityGameID: 1002, amount: 60000, overkill: 10000 },
];
const burst = analyzeDeath({ type: 'death', timestamp: 60000, targetID: 2, fight: 1 }, ev3, lk);
check('burst detected', burst.kind === 'burst', burst.kind + ': ' + burst.headline);

// Tank melee death.
const ev4 = Array.from({ length: 6 }, (_, i) => ({ timestamp: 54000 + i * 1000, type: 'damage', sourceID: 50, targetID: 1, abilityGameID: 1, amount: 40000, overkill: i === 5 ? 500 : 0 }));
const tank = analyzeDeath({ type: 'death', timestamp: 59000, targetID: 1, fight: 1 }, ev4, lk);
check('tank melee note', tank.notes.some((n) => n.includes('melee hits from Jasper Guardian while tanking')), tank.notes.join(' | '));

// Fall.
const fall = analyzeDeath({ type: 'death', timestamp: 10000, targetID: 4, fight: 1 },
  [{ timestamp: 10000, type: 'damage', sourceID: -1, targetID: 4, abilityGameID: 3, amount: 99999, overkill: 1 }], lk);
check('fall detected', fall.kind === 'fall', fall.kind);
check('environment source', fall.notes[0].includes('Environment'), fall.notes[0]);

// No events at all.
const unk = analyzeDeath({ type: 'death', timestamp: 10000, targetID: 4, fight: 1, killingAbilityGameID: 1002 }, [], lk);
check('unknown with killing ability', unk.kind === 'unknown' && unk.headline.includes('Overload'), unk.headline);

// Fight-level wipe analysis: 4 players, collapse after 2nd death.
const deaths = [
  { type: 'death', timestamp: 60000, targetID: 3, fight: 1 },
  { type: 'death', timestamp: 59500, targetID: 4, fight: 1 },
  { type: 'death', timestamp: 90000, targetID: 1, fight: 1 },
];
const fa = analyzeFight(report.fights[0], deaths, [...ev, ...ev2], lk);
check('first death is Stabby', fa.analyses[0].pid === 4, String(fa.analyses[0].pid));
check('first death flagged', fa.analyses[0].notes.includes('First death of the pull.'));
check('collapse at 2nd death', fa.collapseAt === 60000, String(fa.collapseAt));
check('later death minor', fa.analyses[2].minor === true);
check('wipe summary %', fa.summary[0].includes('35%'), fa.summary[0]);

const killFa = analyzeFight(report.fights[1], [], [], lk);
check('kill summary', killFa.summary[0].startsWith('Killed in 3:20'), killFa.summary[0]);

// Report summary.
const s = summarizeReport(report, deaths, lk);
check('one encounter', s.encounters.length === 1);
check('best wipe', s.encounters[0].bestWipe === 34.5);
check('kills counted', s.encounters[0].kills.length === 1 && s.encounters[0].wipes.length === 1);
check('takeaway mentions bosses', s.takeaways[0].startsWith('1 of 1 bosses killed, 1 wipe'), s.takeaways[0]);

// Consumables.
const combatants = [
  { type: 'combatantinfo', sourceID: 1, auras: [{ ability: 105691 }, { ability: 104277 }] },
  { type: 'combatantinfo', sourceID: 2, auras: [{ ability: 104277 }, { ability: 105702 }] },
  { type: 'combatantinfo', sourceID: 3, auras: [] },
];
const pots = [
  { type: 'cast', sourceID: 3, abilityGameID: 105702, timestamp: 1000 },
  { type: 'cast', sourceID: 1, abilityGameID: 105702, timestamp: 60000 },
];
const c = consumables(report.fights[0], combatants, pots, lk);
check('missing flask', c.missingFlask.join() === '2,3', c.missingFlask.join());
check('missing food', c.missingFood.join() === '3', c.missingFood.join());
check('aura pre-pot', c.rows.find((r) => r.pid === 2).prePot === true);
check('cast pre-pot', c.rows.find((r) => r.pid === 3).prePot === true);
check('combat pot', c.rows.find((r) => r.pid === 1).combatPots === 1);
check('no potions list', c.noPotions.join() === '4', c.noPotions.join());

// Utility.
const u = utility([{ type: 'interrupt', sourceID: 4, abilityGameID: 3000, extraAbilityGameID: 3001 },
  { type: 'interrupt', sourceID: 4, abilityGameID: 3000, extraAbilityGameID: 3001 }], 'interrupt', lk);
check('interrupt tally', u[0].count === 2 && u[0].spells[0][0] === 3001, JSON.stringify(u));

// Throughput.
const t = throughput({ entries: [{ id: 3, name: 'Pewpew', type: 'Mage', total: 1200000 }, { id: 4, name: 'Stabby', type: 'Rogue', total: 2400000 }] }, report.fights[0], lk);
check('throughput sorted', t[0].name === 'Stabby' && t[0].perSec === 20000, JSON.stringify(t[0]));

// Link parsing.
const p1 = parseReportLink('https://classic.warcraftlogs.com/reports/AbCdEf1234567890#fight=7&type=damage-done');
check('parse classic link', p1 && p1.host === 'classic.warcraftlogs.com' && p1.code === 'AbCdEf1234567890' && p1.fight === 7, JSON.stringify(p1));
const p2 = parseReportLink('warcraftlogs.com/reports/AbCdEf1234567890');
check('parse bare www link', p2 && p2.host === 'www.warcraftlogs.com', JSON.stringify(p2));
check('parse bare code', parseReportLink('AbCdEf1234567890')?.host === 'classic.warcraftlogs.com');
check('reject other host', parseReportLink('https://evil.com/reports/AbCdEf1234567890') === null);

// ---------- Player performance ----------
const { analyzePlayer, specOf, findRanking } = await import('../js/performance.js');
const pfight = { id: 9, encounterID: 100, name: 'Stone Guard', kill: true, startTime: 0, endTime: 600000, friendlyPlayers: [1, 2, 3, 4] };
report.masterData.abilities.push({ gameID: 12472, name: 'Icy Veins' }, { gameID: 55342, name: 'Mirror Image' }, { gameID: 116, name: 'Frostbolt' });
const plk = buildLookups(report);
const cast = (ts, id, src = 3) => ({ type: 'cast', timestamp: ts, sourceID: src, abilityGameID: id });
const mageCasts = [cast(1000, 12472), cast(200000, 12472), ...Array.from({ length: 100 }, (_, i) => cast(2000 + i * 5000, 116))];
const damage = { entries: [{ id: 3, name: 'Pewpew', type: 'Mage', icon: 'Mage-Frost', total: 60_000_000, activeTime: 510000 }] };
const healing = { entries: [{ id: 2, name: 'Healz', type: 'Priest', icon: 'Priest-Holy', total: 30_000_000, overheal: 30_000_000, activeTime: 400000 }] };

check('specOf', specOf(damage.entries[0]) === 'Frost');
const mage = analyzePlayer({ fight: pfight, pid: 3, lk: plk, damage, healing, casts: mageCasts, deaths: [], prep: null, rankings: null });
const iv = mage.cooldowns.find((c) => c.name === 'Icy Veins');
check('icy veins uses/possible', iv && iv.uses === 2 && iv.possible === 4, JSON.stringify(iv));
check('mirror image never used flagged', mage.tips.some((t) => t.level === 'major' && t.text.startsWith('You never used Mirror Image')), JSON.stringify(mage.tips));
check('active time minor tip at 85%', mage.tips.some((t) => t.level === 'minor' && t.text.startsWith('You were active 85%')), JSON.stringify(mage.tips));
check('tips sorted major first', mage.tips[0].level === 'major');
check('dps', Math.round(mage.dps) === 100000, String(mage.dps));
check('frostbolt cpm', Math.abs(mage.abilities.find((a) => a.name === 'Frostbolt').cpm - 10) < 0.01);

const deadMage = analyzePlayer({ fight: pfight, pid: 3, lk: plk, damage, healing, casts: mageCasts, deaths: [{ type: 'death', targetID: 3, timestamp: 300000 }], prep: null, rankings: null });
check('death tip first', deadMage.tips[0].text.startsWith('You died at 5:00 and missed 50%'), deadMage.tips[0].text);
check('icy veins possible shrinks when dead', deadMage.cooldowns.find((c) => c.name === 'Icy Veins').possible === 2);

const priest = analyzePlayer({ fight: pfight, pid: 2, lk: plk, damage, healing, casts: [], deaths: [], prep: null, rankings: null });
check('healer role', priest.role === 'healer');
check('overheal 50% minor', priest.tips.some((t) => t.level === 'minor' && t.text.startsWith('50% of your healing')), JSON.stringify(priest.tips));
check('no active-time tip for healers', !priest.tips.some((t) => t.text.includes('active')));

const rk = { data: [{ fightID: 9, roles: { dps: { characters: [{ name: 'Pewpew', rankPercent: 82.4 }] } } }] };
check('find ranking', findRanking(rk, 9, 'Pewpew')?.rankPercent === 82.4);
const ranked = analyzePlayer({ fight: pfight, pid: 3, lk: plk, damage, healing, casts: mageCasts, deaths: [], prep: null, rankings: rk });
check('parse tip', ranked.tips.some((t) => t.level === 'good' && t.text.startsWith('82nd percentile')), JSON.stringify(ranked.tips));

// ---------- Kudos ----------
const { fightKudos, reportKudos } = await import('../js/kudos.js');
const kdetail = {
  damage: { entries: [
    { id: 3, name: 'Pewpew', type: 'Mage', icon: 'Mage-Frost', total: 12_000_000, activeTime: 115000 },
    { id: 4, name: 'Stabby', type: 'Rogue', icon: 'Rogue-Combat', total: 9_000_000, activeTime: 50000 },
  ] },
  healing: { entries: [{ id: 2, name: 'Healz', type: 'Priest', icon: 'Priest-Holy', total: 6_000_000 }] },
  interrupts: [{ type: 'interrupt', sourceID: 4, extraAbilityGameID: 3001 }],
  dispels: [],
};
const krk = { data: [{ fightID: 1, roles: { dps: { characters: [{ name: 'Pewpew', rankPercent: 91 }] } } }] };
const kprep = consumables(report.fights[0], combatants, pots, lk);
const fk = fightKudos({ fight: report.fights[0], lk, detail: kdetail, deaths, prep: kprep, rankings: krk });
const kudo = (title) => fk.find((k) => k.title === title);
check('kudos top damage', kudo('Top damage')?.pids[0] === 3 && kudo('Top damage').text === '100k DPS', JSON.stringify(kudo('Top damage')));
check('kudos top healing', kudo('Top healing')?.pids[0] === 2);
check('kudos interrupts', kudo('Most interrupts')?.pids[0] === 4 && kudo('Most interrupts').text === '1 interrupt');
check('kudos no dispels tile', !kudo('Most dispels'));
check('kudos always casting (mage alive 115s of 120s)', kudo('Always casting')?.pids[0] === 3, JSON.stringify(kudo('Always casting')));
check('kudos top parse', kudo('Top parse')?.pids[0] === 3);
check('kudos fully prepared', kudo('Fully prepared')?.pids.join() === '1', JSON.stringify(kudo('Fully prepared')));
check('kudos last standing on wipe', kudo('Last standing')?.pids.join() === '2', JSON.stringify(kudo('Last standing')));

const rkudos = reportKudos({ report, lk, deaths, totals: { damage: kdetail.damage, healing: kdetail.healing, interrupts: kdetail.interrupts, dispels: [] } });
const rk2 = (title) => rkudos.find((k) => k.title === title);
check('report never died', rk2('Never died')?.pids.join() === '2', JSON.stringify(rk2('Never died')));
check('report most damage', rk2('Most damage tonight')?.pids[0] === 3);
check('report kudos without totals', reportKudos({ report, lk, deaths, totals: null }).every((k) => !k.title.endsWith('tonight')));

// ---------- Prep & gear ----------
const { prepOverview } = await import('../js/prep.js');
// 19 slots in slot order; empty slots have id 0. Warrior: 2H (no off hand), legs and feet unenchanted.
const gearOf = (ilvl, unenchanted = []) => Array.from({ length: 19 }, (_, slot) => {
  if (slot === 16 || slot === 17) return { id: 0 };
  if (slot === 3 || slot === 18) return { id: 5000 + slot, itemLevel: 1 };
  return { id: 1000 + slot, itemLevel: ilvl, quality: 4, permanentEnchant: unenchanted.includes(slot) ? 0 : 4400 };
});
const ciNight = [
  { type: 'combatantinfo', fight: 1, sourceID: 1, auras: [{ ability: 105691 }, { ability: 104277 }], gear: gearOf(490) },
  { type: 'combatantinfo', fight: 2, sourceID: 1, auras: [{ ability: 104277 }], gear: gearOf(496, [6, 7]) },
  { type: 'combatantinfo', fight: 1, sourceID: 2, auras: [{ ability: 105691 }, { ability: 104277 }], gear: gearOf(480) },
  { type: 'combatantinfo', fight: 2, sourceID: 2, auras: [{ ability: 105691 }, { ability: 104277 }], gear: gearOf(480) },
];
const potsNight = [{ type: 'cast', fight: 2, sourceID: 2, abilityGameID: 105702, timestamp: 200500 }];
const po = prepOverview(report, lk, ciNight, potsNight);
const warrior = po.players.find((p) => p.pid === 1);
const priestP = po.players.find((p) => p.pid === 2);
check('prep: gear from latest pull', warrior.ilvl === 496, String(warrior.ilvl));
check('prep: 2H counted twice over 16 slots', priestP.ilvl === 480, String(priestP.ilvl));
check('prep: shirt/tabard excluded from gear', !warrior.gear.some((g) => g.slot === 3 || g.slot === 18));
check('prep: missing enchants named', warrior.missingEnchants.join() === 'Legs,Feet', warrior.missingEnchants.join());
check('prep: flask 1 of 2', warrior.flaskPct === 0.5 && warrior.flaskMissed === 1);
check('prep: priest pre-pot 1 of 2', priestP.prePotPct === 0.5, String(priestP.prePotPct));
check('prep: sorted by ilvl', po.players[0].pid === 1);
check('prep: no-info players have null rates', po.players.find((p) => p.pid === 3).flaskPct === null);
check('prep: issues mention flask and enchants', po.issues.some((i) => i.startsWith('Pulled without a flask: Tanky (1/2)')) && po.issues.some((i) => i.includes('Tanky (legs, feet)')), JSON.stringify(po.issues));
check('prep: raid flask rate', po.flaskPct === 0.75, String(po.flaskPct));

// ---------- Raid grouping ----------
const { groupByRaid } = await import('../js/analysis.js');
const enc = (id, start, kill) => ({ id, name: `Boss ${id}`, pulls: [{ fight: { id, startTime: start } }], kills: kill ? [{}] : [] });
const zoneMap = { 1: { id: 10, name: 'Heart of Fear' }, 2: { id: 20, name: "Mogu'shan Vaults" }, 3: { id: 10, name: 'Heart of Fear' } };
const grouped = groupByRaid([enc(1, 500, true), enc(2, 100, true), enc(3, 900, false)], (f) => zoneMap[f.id]);
check('raids: grouped by zone', grouped.length === 2 && grouped.map((g) => g.encounters.length).join() === '1,2', JSON.stringify(grouped.map((g) => g.name)));
check('raids: ordered by first pull', grouped[0].name === "Mogu'shan Vaults", grouped[0].name);
check('raids: kill count', grouped[1].killed === 1 && grouped[1].pulls === 2);
const single = groupByRaid([enc(1, 0, true), enc(2, 10, false)], () => null, "Mogu'shan Vaults");
check('raids: no zone data falls back to report zone', single.length === 1 && single[0].name === "Mogu'shan Vaults", JSON.stringify(single));

// ---------- Player across the night ----------
const { analyzeNightPlayer } = await import('../js/performance.js');
const nightTables = new Map(report.fights.map((f) => [f.id, {
  damage: { entries: [{ id: 3, name: 'Pewpew', type: 'Mage', icon: 'Mage-Frost', total: (f.endTime - f.startTime) * 100, activeTime: (f.endTime - f.startTime) * 0.95 }] },
  healing: { entries: [] },
}]));
const nightRanks = new Map([[2, { data: [{ fightID: 2, roles: { dps: { characters: [{ name: 'Pewpew', rankPercent: 88 }] } } }] }]]);
const np = analyzeNightPlayer({
  report, lk, pid: 3, deaths, firstDeaths: 1, fightTables: nightTables, rankings: nightRanks,
  prep: { info: 2, flaskMissed: 1, foodMissed: 0 },
});
check('night: one row per pull', np.rows.length === 2 && np.rows[0].pullNo === 1 && np.rows[1].pullNo === 2);
check('night: spec and role', np.spec === 'Frost' && np.role === 'dps' && np.outputLabel === 'DPS');
check('night: output across boss time', Math.round(np.output) === 100000, String(np.output));
check('night: death and parse', np.deaths === 1 && np.rows[0].diedAt === 60000 && np.rows[1].parse === 88 && np.rows[0].parse === null);
check('night: highlights', np.highlights.some((h) => h.text.startsWith('Died on 1 of 2 pulls, and was the first to die on 1 wipe'))
  && np.highlights.some((h) => h.text.startsWith('Best parse: 88 on Stone Guard')) && np.highlights.some((h) => h.text.startsWith('Prep: no flask on 1 of 2')),
JSON.stringify(np.highlights));

// ---------- Guild ----------
const { summarizeGuild, summarizeAttendance } = await import('../js/guild.js');
const { parseGuildLink, parseLink } = await import('../js/api.js');
const gf = (id, enc, name, kill, start, secs, pct = 0) => ({ id, encounterID: enc, name, kill, bossPercentage: pct, startTime: start, endTime: start + secs * 1000, difficulty: 3 });
const day = 86_400_000;
const greports = [
  { code: 'N3', title: 'Night 3', startTime: 3 * day, zone: { name: 'MSV' }, fights: [gf(1, 1, 'Stone Guard', true, 0, 250), gf(2, 2, 'Feng', true, 400000, 300)] },
  { code: 'N1', title: 'Night 1', startTime: 1 * day, zone: { name: 'MSV' }, fights: [gf(1, 1, 'Stone Guard', false, 0, 150, 40), gf(2, 1, 'Stone Guard', false, 200000, 150, 12), gf(3, 1, 'Stone Guard', true, 400000, 330)] },
  { code: 'N2', title: 'Night 2', startTime: 2 * day, zone: { name: 'MSV' }, fights: [gf(1, 1, 'Stone Guard', true, 0, 300), gf(2, 2, 'Feng', false, 400000, 200, 33), gf(3, 3, "Gara'jal", false, 700000, 100, 61)] },
];
const gsum = summarizeGuild(greports);
const sg = gsum.bosses.find((b) => b.name === 'Stone Guard');
check('guild: nights sorted oldest first', gsum.nights.map((n) => n.code).join() === 'N1,N2,N3');
check('guild: wipes before first kill', sg.wipesBeforeKill === 2 && sg.kills.length === 3, JSON.stringify({ w: sg.wipesBeforeKill, k: sg.kills.length }));
check('guild: first kill is night 1', sg.firstKill.code === 'N1');
check('guild: fastest kill', sg.fastest.duration === 250000 && sg.fastest.code === 'N3');
check('guild: new kills per night', gsum.nights[0].newKills.join() === 'Stone Guard' && gsum.nights[2].newKills.join() === 'Feng', JSON.stringify(gsum.nights.map((n) => n.newKills)));
check('guild: unkilled best wipe', gsum.bosses.find((b) => b.name === "Gara'jal").bestWipe.pct === 61);
check('guild: raids grouped', gsum.raids.length === 1 && gsum.raids[0].killed === 2 && gsum.raids[0].bosses.length === 3);
check('guild: takeaway counts', gsum.takeaways[0].startsWith('3 raid nights since') && gsum.takeaways[0].includes('2 of 3 bosses killed'), gsum.takeaways[0]);
check('guild: latest-night first kill takeaway', gsum.takeaways.some((t) => t.startsWith('First kills on the latest night') && t.includes('Feng')), JSON.stringify(gsum.takeaways));
check('guild: progression takeaway', gsum.takeaways.some((t) => t.startsWith("Still working on Gara'jal: 1 pull over 1 night")), JSON.stringify(gsum.takeaways));
check('guild: faster kills takeaway', gsum.takeaways.some((t) => t.includes('Stone Guard 5:30 → 4:10')), JSON.stringify(gsum.takeaways));

// Difficulty and size labels only appear when a boss has more than one variant.
const vf = (id, diff, size, kill) => ({ ...gf(id, 1, 'Stone Guard', kill, id * 400000, 300), difficulty: diff, size });
const vreports = [{ code: 'V1', startTime: day, zone: { id: 1008, name: 'MSV' }, fights: [vf(1, 3, 10, true), vf(2, 4, 10, false), vf(3, 3, 25, true), vf(4, 99, 10, true)] }];
const vnames = new Map([['1008:3', 'Normal'], ['1008:4', 'Heroic']]);
const vsum = summarizeGuild(vreports, { difficultyNames: vnames });
const labels = vsum.bosses.map((b) => b.label).sort();
check('difficulty: named from API', labels.includes('Stone Guard (Heroic, 10-player)'), JSON.stringify(labels));
check('difficulty: size added when sizes differ', labels.includes('Stone Guard (Normal, 10-player)') && labels.includes('Stone Guard (Normal, 25-player)'), JSON.stringify(labels));
check('difficulty: unknown id falls back to number', labels.includes('Stone Guard (difficulty 99, 10-player)'), JSON.stringify(labels));
const heroicOnly = summarizeGuild([{ code: 'H', startTime: day, zone: { id: 1008, name: 'MSV' }, fights: [vf(1, 3, 10, true), vf(2, 4, 10, true)] }], { difficultyNames: vnames });
check('difficulty: name alone when sizes match', heroicOnly.bosses.map((b) => b.label).sort().join() === 'Stone Guard (Heroic),Stone Guard (Normal)', JSON.stringify(heroicOnly.bosses.map((b) => b.label)));
check('difficulty: new kills use labels', vsum.nights[0].newKills.includes('Stone Guard (Normal, 25-player)'), JSON.stringify(vsum.nights[0].newKills));
const sized = summarizeGuild([{ code: 'S', startTime: day, zone: { id: 1, name: 'X' }, fights: [vf(1, 3, 10, true), vf(2, 3, 25, true)] }],
  { difficultyNames: new Map([['1:3', '25 Player (Heroic)']]) });
check('difficulty: no size label when difficulty is the same', sized.bosses.map((b) => b.label).sort().join() === 'Stone Guard (10-player),Stone Guard (25-player)', JSON.stringify(sized.bosses.map((b) => b.label)));
check('difficulty: single variant has no label', gsum.bosses.every((b) => !b.label.includes('(')));
const moved = summarizeGuild([
  { code: 'M1', startTime: day, zone: { id: 1008, name: 'MSV' }, fights: [vf(1, 3, 10, true)] },
  { code: 'M2', startTime: 2 * day, zone: { id: 1009, name: 'HoF' }, fights: [vf(1, 4, 10, true)] },
], { difficultyNames: vnames });
check('raid grouping: later variants follow the boss home', moved.raids.length === 1 && moved.raids[0].name === 'MSV' && moved.raids[0].bosses.length === 2,
  JSON.stringify(moved.raids.map((r) => [r.name, r.bosses.length])));

const att = summarizeAttendance([
  { code: 'a', players: [{ name: 'A', type: 'Mage', presence: 1 }, { name: 'B', type: 'Rogue', presence: 1 }] },
  { code: 'b', players: [{ name: 'A', type: 'Mage', presence: 1 }, { name: 'B', type: 'Rogue', presence: 2 }] },
  { code: 'c', players: [{ name: 'A', type: 'Mage', presence: 1 }, { name: 'B', type: 'Rogue', presence: 0 }] },
]);
check('attendance: totals', att.total === 3 && att.rows[0].name === 'A' && att.rows[0].pct === 1);
check('attendance: benched counts', att.rows[1].benched === 1 && Math.abs(att.rows[1].pct - 2 / 3) < 1e-9);

// Roster: members merged with attendance (nights newest first after sorting).
const { buildRoster } = await import('../js/guild.js');
const rn = (code, t, presences) => ({ code, startTime: t, players: Object.entries(presences).map(([name, presence]) => ({ name, type: name === 'Pug' ? 'Rogue' : 'Mage', presence })) });
const rosterAtt = [
  rn('r1', 1, { Ann: 1, Bob: 1, Pug: 0 }), rn('r2', 2, { Ann: 1, Bob: 0, Pug: 0 }), rn('r3', 3, { Ann: 1, Bob: 0, Pug: 0 }),
  rn('r4', 4, { Ann: 1, Bob: 0, Pug: 1 }),
];
const rosterMembers = { members: [{ name: 'Ann', guildRank: 0, classID: 4 }, { name: 'Bob', guildRank: 2, classID: 4 }, { name: 'Alt', guildRank: 5, classID: 7 }], classNames: new Map([[4, 'Mage'], [7, 'Priest']]) };
const ros = buildRoster(rosterAtt, rosterMembers);
const rrow = (n) => ros.rows.find((x) => x.name === n);
check('roster: raiding in last 3', rrow('Ann').status === 'raiding' && rrow('Pug').status === 'raiding');
check('roster: lapsed when only older raids', rrow('Bob').status === 'lapsed', rrow('Bob').status);
check('roster: idle member', rrow('Alt').status === 'idle' && rrow('Alt').className === 'Priest');
check('roster: outsider flagged', rrow('Pug').member === false && ros.counts.outsiders === 1);
check('roster: counts', ros.counts.members === 3 && ros.counts.raiding === 2 && ros.counts.lapsed === 1 && ros.counts.idle === 1, JSON.stringify(ros.counts));
check('roster: last raid date', rrow('Bob').lastRaid === 1 && rrow('Ann').lastRaid === 4);
check('roster: composition of raiders', ros.composition.map(([c, n]) => `${c}:${n}`).join() === 'Mage:1,Rogue:1', JSON.stringify(ros.composition));
check('roster: raiding sorted first', ros.rows[0].status === 'raiding' && ros.rows[ros.rows.length - 1].status === 'idle');
const noMembers = buildRoster(rosterAtt, null);
check('roster: no member list falls back to raiders', !noMembers.hasMembers && noMembers.rows.every((x) => x.member) && noMembers.counts.outsiders === 0);

// Raid team: raiders grouped by the role they played most.
const { buildRaidTeam } = await import('../js/guild.js');
const team = buildRaidTeam(ros, [
  { name: 'Ann', role: 'healer', className: 'Mage', spec: 'Frost' },
  { name: 'Ann', role: 'dps', className: 'Mage', spec: 'Frost' },
  { name: 'Ann', role: 'dps', className: 'Mage', spec: 'Fire' },
  { name: 'Ann', role: 'dps', className: 'Mage', spec: 'Fire' },
  { name: 'Bob', role: 'tank', className: 'Mage', spec: 'Frost' },
]);
check('team: most-played role and spec', team.dps.length === 1 && team.dps[0].name === 'Ann' && team.dps[0].spec === 'Fire', JSON.stringify(team.dps));
check('team: only current raiders (lapsed Bob left out)', !team.tank.length);
check('team: unseen raiders go under unknown role', team.unknown.map((p) => p.name).join() === 'Pug' && team.unknown[0].className === 'Rogue', JSON.stringify(team.unknown));
const { specIcon } = await import('../js/api.js');
check('spec icon url', specIcon('Death Knight', 'Blood').endsWith('/icons/DeathKnight-Blood.jpg') && specIcon('Hunter', 'Beast Mastery').endsWith('/icons/Hunter-BeastMastery.jpg') && specIcon('Mage', null).endsWith('/icons/Mage.jpg'));

// Raid progress: full boss list from the site, merged across difficulties.
const prog = summarizeGuild(greports, { zoneEncounters: new Map([[undefined, []]]) }).progress;
check('progress: falls back to bosses seen', prog[0].total === 3 && prog[0].killed === 2 && !prog[0].cleared, JSON.stringify(prog.map((p) => [p.total, p.killed])));
const listed = summarizeGuild([{ ...greports[0], zone: { id: 9, name: 'MSV' } }], {
  zoneEncounters: new Map([[9, [{ id: 1, name: 'Stone Guard' }, { id: 2, name: 'Feng' }, { id: 5, name: 'Elegon' }]]]),
}).progress[0];
check('progress: uses the site boss list in order', listed.bosses.map((b) => b.name).join() === 'Stone Guard,Feng,Elegon' && listed.total === 3, JSON.stringify(listed.bosses.map((b) => b.name)));
check('progress: unpulled boss not killed, raid not cleared', !listed.bosses[2].killed && listed.bosses[2].pulls === 0 && listed.killed === 2 && !listed.cleared);

// Attendance counts from each player's first raid, so late joiners aren't marked down for raids before their time.
const late = summarizeAttendance([
  { code: 'n3', startTime: 3, players: [{ name: 'Vet', presence: 1 }, { name: 'New', presence: 1 }] },
  { code: 'n1', startTime: 1, players: [{ name: 'Vet', presence: 1 }] },
  { code: 'n2', startTime: 2, players: [{ name: 'Vet', presence: 0 }, { name: 'New', presence: 1 }] },
]);
const lrow = (n) => late.rows.find((x) => x.name === n);
check('attendance: span from first raid', lrow('New').span === 2 && lrow('New').pct === 1 && lrow('Vet').span === 3 && Math.abs(lrow('Vet').pct - 2 / 3) < 1e-9,
  JSON.stringify(late.rows));

// Item names from Wowhead tooltip data (fetch stubbed), written as text with the slot name as fallback.
const { fillItemNames } = await import('../js/items.js');
const realFetch = window.fetch;
window.fetch = async (url) => (String(url).includes('/item/111')
  ? new Response(JSON.stringify({ name: '<b>Blade</b> of Tests', quality: 4 }), { status: 200 })
  : new Response('', { status: 404 }));
const box = document.createElement('div');
box.innerHTML = '<a data-item-id="111">Main hand</a><a data-item-id="222">Off hand</a>';
document.body.appendChild(box);
await fillItemNames(box);
box.remove();
window.fetch = realFetch;
const [named, unnamed] = box.querySelectorAll('a');
check('items: name filled in as text', named.textContent === '<b>Blade</b> of Tests' && !named.querySelector('b') && named.classList.contains('named'));
check('items: fallback kept when lookup fails', unnamed.textContent === 'Off hand' && !unnamed.classList.contains('named'));

// Top difficulty only: 25-player wins over 10, then the highest difficulty pulled at that size.
const tf = (id, diff, size, kill, pct = 40) => ({ ...gf(id, 1, 'Stone Guard', kill, id * 400000, 300, pct), difficulty: diff, size });
const topRep = [{ code: 'T', startTime: day, zone: { id: 1008, name: 'MSV' }, fights: [tf(1, 3, 10, true), tf(2, 4, 10, true), tf(3, 3, 25, true), tf(4, 4, 25, false, 22)] }];
const topSum = summarizeGuild(topRep, { topOnly: true, difficultyNames: vnames });
check('top only: one row at heroic 25', topSum.bosses.length === 1 && topSum.bosses[0].difficulty === 4 && topSum.bosses[0].size === 25, JSON.stringify(topSum.bosses.map((b) => [b.difficulty, b.size])));
check('top only: heroic 25 not yet killed', topSum.bosses[0].kills.length === 0 && topSum.bosses[0].bestWipe.pct === 22);
check('top only: variant label', topSum.bosses[0].variant === 'Heroic · 25-player', topSum.bosses[0].variant);
check('top only: raid nights still count every pull', topSum.nights[0].pulls === 4 && topSum.nights[0].kills === 3);
const tenOnly = summarizeGuild([{ ...topRep[0], fights: [tf(1, 3, 10, true), tf(2, 4, 10, true)] }], { topOnly: true });
check('top only: 10-player kept when it is all there is', tenOnly.bosses.length === 1 && tenOnly.bosses[0].size === 10 && tenOnly.bosses[0].difficulty === 4);

// Raid progress by expansion, newest first; guild-wide tiles.
const { groupByExpansion, guildTotals } = await import('../js/guild.js');
const prog2 = [
  { name: 'Molten Core', zoneId: 1000, lastSeen: 5, killed: 10, total: 10, cleared: true },
  { name: 'Heart of Fear', zoneId: 1009, lastSeen: 50, killed: 1, total: 6, cleared: false },
  { name: "Mogu'shan Vaults", zoneId: 1008, lastSeen: 40, killed: 6, total: 6, cleared: true },
];
const exps = new Map([[1000, { id: 1, name: 'Classic' }], [1008, { id: 5, name: 'Mists of Pandaria' }], [1009, { id: 5, name: 'Mists of Pandaria' }]]);
const grouped2 = groupByExpansion(prog2, exps);
check('expansions: newest expansion first', grouped2.map((g) => g.name).join() === 'Mists of Pandaria,Classic');
check('expansions: latest raid first within', grouped2[0].raids.map((x) => x.name).join() === "Heart of Fear,Mogu'shan Vaults");
check('expansions: unknown goes under Raids', groupByExpansion(prog2).length === 1 && groupByExpansion(prog2)[0].name === 'Raids');
const tot = guildTotals([{ startTime: 300 }, { startTime: 100 }, { startTime: 200 }], prog2, true);
check('totals', tot.nights === 3 && tot.since === 100 && tot.cleared === 2 && tot.raids === 3 && tot.bossesKilled === 17 && tot.capped);

// Dates show the year only when it isn't this year.
const { fmtDay } = await import('../js/analysis.js');
const thisYear = new Date().getFullYear();
check('dates: no year for this year', !fmtDay(new Date(thisYear, 2, 5).getTime()).includes(String(thisYear)));
check('dates: year for other years', fmtDay(new Date(2019, 7, 27).getTime()).includes('2019'));

const g1 = parseGuildLink('https://classic.warcraftlogs.com/guild/id/123456');
check('guild link: by id', g1?.host === 'classic.warcraftlogs.com' && g1.guild.id === 123456, JSON.stringify(g1));
const g2 = parseGuildLink('https://classic.warcraftlogs.com/guild/us/mirage-raceway/Fable%20Hub');
check('guild link: by name', g2?.guild.region === 'us' && g2.guild.server === 'mirage-raceway' && g2.guild.name === 'Fable Hub', JSON.stringify(g2));
check('guild link: other tabs', parseGuildLink('classic.warcraftlogs.com/guild/reports-list/987')?.guild.id === 987);
check('guild link: rejects other hosts', parseGuildLink('https://evil.example/guild/id/1') === null);
check('parseLink: kinds', parseLink('https://classic.warcraftlogs.com/reports/AbCdEf1234567890')?.kind === 'report' && parseLink('https://classic.warcraftlogs.com/guild/id/5')?.kind === 'guild');

// ---------- mechanics ----------
const { analyzeMechanics, nightMechanics, trackedNames, mechanicsFor } = await import('../js/mechanics.js');
const mlk = buildLookups({
  masterData: {
    actors: [1, 2, 3, 4].map((id) => ({ id, name: `P${id}`, type: 'Player', subType: 'Warrior' })),
    abilities: [{ gameID: 10, name: 'Scorching Breath' }, { gameID: 11, name: 'Fearsome Roar' }, { gameID: 12, name: 'Chain Heal' }, { gameID: 13, name: 'Swirl' }],
  },
});
const thok = { id: 7, name: 'Thok the Bloodthirsty', startTime: 1000, endTime: 61000 };
const dmg = (ts, target, ab, amount, fightId = 7) => ({ timestamp: ts, type: 'damage', targetID: target, abilityGameID: ab, amount, fight: fightId });
const mres = analyzeMechanics(thok, [dmg(2000, 1, 10, 100), dmg(3000, 2, 10, 50), dmg(4000, 2, 10, 50), dmg(5000, 3, 11, 10), dmg(99000, 2, 10, 50, 8)], [], [], mlk, (pid) => (pid === 1 ? 'tank' : 'dps'));
const breath = mres.avoid.find((a) => a.name === 'Scorching Breath');
check('mechanics: tank hits by frontals ignored', breath.hits === 2 && breath.players.length === 1 && breath.players[0].pid === 2, JSON.stringify(breath));
check('mechanics: other fights ignored', breath.damage === 100);
check('mechanics: abilities missing from the log are left out', !mres.avoid.some((a) => a.name === 'Acid Breath') && mres.untracked.includes('Acid Breath'));
check('mechanics: players ranked', mres.players[0].pid === 2 && mres.players[0].hits === 2 && mres.players[1].pid === 3);
check('mechanics: unknown boss', analyzeMechanics({ id: 1, name: 'Nobody', startTime: 0, endTime: 1 }, [], [], [], mlk) === null && mechanicsFor('Nobody') === null);
const garrosh = { id: 9, name: 'Garrosh Hellscream', startTime: 0, endTime: 60000 };
const ints = analyzeMechanics(garrosh, [], [{ timestamp: 100, type: 'cast', abilityGameID: 12, fight: 9 }, { timestamp: 200, type: 'cast', abilityGameID: 12, fight: 9 }],
  [{ timestamp: 300, type: 'interrupt', sourceID: 3, extraAbilityGameID: 12, fight: 9 }], mlk);
const ch = ints.interrupt.find((a) => a.name === 'Chain Heal');
check('mechanics: interrupts counted', ch.wentOff === 2 && ch.interrupted === 1 && ch.by[0][0] === 3, JSON.stringify(ch));
check('mechanics: summary mentions casts that went off', ints.summary.some((s) => s.startsWith('Chain Heal went off 2 times')));
const tn = trackedNames(['Thok the Bloodthirsty', 'Garrosh Hellscream', 'Thok the Bloodthirsty']);
check('mechanics: tracked names merged', tn.avoid.includes('Scorching Breath') && tn.avoid.includes('Desecrated') && tn.interrupt.includes('Chain Heal'));
const night = nightMechanics([thok, { ...thok, id: 8, startTime: 90000, endTime: 120000 }], [dmg(2000, 2, 10, 50), dmg(99000, 2, 10, 50, 8), dmg(100000, 3, 10, 50, 8)], mlk, () => 'dps');
check('mechanics: night totals', night.players[0].pid === 2 && night.players[0].hits === 2 && night.players[0].pulls === 2 && night.abilities[0].hits === 3, JSON.stringify(night));

// ---------- raid buffs ----------
const { buffCoverage, debuffCoverage, nightBuffCoverage } = await import('../js/buffs.js');
const blk = buildLookups({ masterData: { actors: [], abilities: [{ gameID: 1, name: 'Mark of the Wild' }, { gameID: 2, name: 'Battle Shout' }] } });
const ci = [{ sourceID: 1, auras: [{ ability: 1 }, { ability: 2 }] }, { sourceID: 2, auras: [{ ability: 2 }] }];
const cov = buffCoverage([1, 2, 3], ci, blk, ['Druid-Feral', 'Warrior-Arms', 'Hunter-Survival']);
const covOf = (k) => cov.find((c) => c.key === k);
check('buffs: coverage counts players with info', covOf('stats').have === 1 && covOf('stats').total === 2 && covOf('ap').pct === 1);
check('buffs: providers', covOf('stats').canProvide && !covOf('spellHaste').canProvide && covOf('spellHaste').hunter && !covOf('ap').hunter);
check('buffs: spec-limited providers', covOf('crit').canProvide && !covOf('mastery').canProvide);
check('buffs: no combatant info', buffCoverage([1], [], blk, []) === null);
const dc = debuffCoverage({ auras: [{ name: 'Weakened Armor', totalUptime: 50000 }, { name: 'Weakened Armor', totalUptime: 90000 }, { name: 'Curse of the Elements', totalUptime: 300000 }] }, { startTime: 0, endTime: 100000 }, blk, ['Warrior-Arms']);
check('debuffs: best uptime, capped', dc.find((d) => d.key === 'armor').uptime === 0.9 && dc.find((d) => d.key === 'magic').uptime === 1 && dc.find((d) => d.key === 'blows').uptime === 0);
check('debuffs: no table', debuffCoverage(null, { startTime: 0, endTime: 1 }, blk, []) === null);
const nbc = nightBuffCoverage([{ fight: { id: 1 }, coverage: cov }, { fight: { id: 2 }, coverage: null }, { fight: { id: 3 }, coverage: cov.map((c) => (c.key === 'stats' ? { ...c, have: 0, pct: 0 } : c)) }]);
const nbStats = nbc.find((b) => b.key === 'stats');
check('buffs: night coverage', nbc[0].pulls === 2 && nbStats.full === 0 && nbStats.missing.map((f) => f.id).join() === '3' && nbc.find((b) => b.key === 'ap').full === 2, JSON.stringify(nbStats));

// ---------- spec uptimes ----------
const { specUptimes } = await import('../js/performance.js');
const { SPEC_MODULES } = await import('../js/specs/index.js');
const ups = specUptimes(SPEC_MODULES['Warlock-Demonology'], { debuffs: { data: { auras: [{ name: 'Corruption', totalUptime: 40000, guid: 172 }, { name: 'Doom', totalUptime: 45000 }] } } }, 100000);
check('uptimes: combined names', ups.length === 1 && Math.abs(ups[0].uptime - 0.85) < 1e-9 && ups[0].label === 'Corruption / Doom' && ups[0].abilityId === 172, JSON.stringify(ups));
const mageUps = specUptimes(SPEC_MODULES['Mage-Frost'], { buffs: { auras: [{ name: 'Invocation', totalUptime: 50000 }] }, debuffs: { auras: [{ name: 'Nether Tempest', totalUptime: 200000 }] } }, 100000);
check('uptimes: talents only when taken, capped', mageUps.map((u) => u.label).join() === 'Nether Tempest,Invocation' && mageUps[0].uptime === 1 && mageUps[1].uptime === 0.5, JSON.stringify(mageUps));
const known = ['DeathKnight', 'Druid', 'Hunter', 'Mage', 'Monk', 'Paladin', 'Priest', 'Rogue', 'Shaman', 'Warlock', 'Warrior'];
check('spec modules: keys are Class-Spec', Object.keys(SPEC_MODULES).every((k) => known.includes(k.split('-')[0]) && k.split('-')[1]));
check('spec modules: well formed', Object.values(SPEC_MODULES).flat().every((c) => ['buff', 'debuff'].includes(c.kind) && c.names.length && c.target > 0 && c.target <= 1 && c.tip));
const pu = analyzePlayer({
  fight: { id: 1, startTime: 0, endTime: 100000 }, pid: 7, lk: buildLookups({ masterData: { actors: [{ id: 7, name: 'Shank', type: 'Player', subType: 'Rogue' }], abilities: [] } }),
  damage: { entries: [{ id: 7, icon: 'Rogue-Combat', total: 1000, activeTime: 95000 }] }, healing: null, casts: [], deaths: [], prep: null, rankings: null,
  auras: { buffs: { auras: [{ name: 'Slice and Dice', totalUptime: 97000 }] }, debuffs: { auras: [{ name: 'Revealing Strike', totalUptime: 60000 }] } },
  mechanics: { avoid: [{}], players: [{ pid: 7, hits: 3, abilities: [['Swirl', 2], ['Sha Pool', 1]] }] },
});
check('player: uptime tips', pu.tips.some((t) => t.level === 'major' && t.text.startsWith('Revealing Strike was up 60%')) && pu.tips.some((t) => t.level === 'good' && t.text.startsWith('Slice and Dice')), JSON.stringify(pu.tips));
check('player: avoidable tip', pu.tips.some((t) => t.level === 'major' && t.text.includes('3 avoidable hits (Swirl ×2, Sha Pool)')));

// ---------- progress charts ----------
const { remainingPct } = await import('../js/analysis.js');
check('remaining: kill is 0', remainingPct({ kill: true, fightPercentage: 40 }) === 0);
check('remaining: prefers fight %', remainingPct({ kill: false, fightPercentage: 40, bossPercentage: 10 }) === 40 && remainingPct({ kill: false, bossPercentage: 1234 }) === 12.34);
const { progressChart } = await import('../js/charts.js');
check('chart: needs two pulls', progressChart([{ pct: 50, title: 'x' }], 'c') === '');
const svg = progressChart([{ pct: 80, title: 'a', night: 'x' }, { pct: 40, title: 'b<', night: 'x' }, { pct: 60, title: 'c', night: 'y', href: '#q' }, { pct: 0, kill: true, title: 'd', night: 'y' }], 'Chart');
check('chart: marks, kill, divider, escaping', (svg.match(/class="pc-wipe"/g) || []).length === 3 && (svg.match(/class="pc-kill"/g) || []).length === 1
  && (svg.match(/class="pc-night"/g) || []).length === 1 && svg.includes('b&lt;') && svg.includes('href="#q"'));

out.innerHTML += `\n${pass} passed, ${fail} failed\n`;
document.title = fail ? `FAIL ${fail}` : `PASS ${pass}`;
</script>
</body>
</html>
