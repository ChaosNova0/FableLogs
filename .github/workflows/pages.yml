# Publishes only the site itself. tests/ stays out on purpose: preview.html writes a fake login token,
# and every github.io project page of this account shares one origin and its localStorage.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js _site/
      # Pages caches files for 10 minutes and modules import each other by fixed names, so a browser can mix
      # an old app.js with new modules. Tagging every script and stylesheet URL with the commit makes each
      # release load as a whole.
      - name: Version asset URLs
        run: |
          v="${GITHUB_SHA::8}"
          find _site/js -name '*.js' -exec sed -i -E "s#(from '\./[A-Za-z0-9_/.-]+\.js)'#\1?v=${v}'#g" {} +
          sed -i -E "s#(src=\"js/app\.js)\"#\1?v=${v}\"#; s#(href=\"css/style\.css)\"#\1?v=${v}\"#" _site/index.html
          grep -c "?v=${v}" _site/index.html
          ! grep -rhoE "from '\./[^']+\.js'" _site/js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
